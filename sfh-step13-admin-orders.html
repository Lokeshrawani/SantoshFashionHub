<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFH Admin — Online Orders</title><style>:root{--ink:#0b1020;--gold:#f4c95d;--paper:#f5f6fa;--line:#dfe3ea;--muted:#667085;--ok:#087443;--bad:#b42318;--orange:#b54708}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,Arial}.wrap{max-width:1200px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.top h1{margin:4px 0;font-size:28px}.top p{margin:0;color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 13px;border-radius:10px;text-decoration:none;font-weight:900}.gold{background:var(--gold);border-color:var(--gold)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:16px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{display:block;font-size:24px}.stat span{font-size:10px;color:var(--muted)}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;min-width:170px}.status{padding:12px;border-radius:12px;background:#eef1f6;font-size:12px;font-weight:800}.ok{background:#eaf8ef;color:var(--ok)}.bad{background:#fdecec;color:var(--bad)}.order{border-top:1px solid var(--line);padding:17px 0}.order:first-child{border-top:0}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.id{font-weight:950;font-size:15px}.date{font-size:10px;color:var(--muted);margin-top:3px}.pill{padding:6px 9px;border-radius:999px;font-size:10px;font-weight:900;background:#eef1f6}.customer{margin-top:10px;font-size:12px;line-height:1.65;color:#445066}.items{margin:9px 0}.item{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:12px}.foot{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.total{font-size:18px;font-weight:950}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions select,.actions button{padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:800}.danger{color:var(--bad)}@media(max-width:800px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.wrap{padding:12px}.top h1{font-size:22px}.item{align-items:flex-start;flex-direction:column;gap:2px}}</style></head><body><main class="wrap"><header class="top"><div><span style="font-size:10px;font-weight:950;letter-spacing:2px;color:#6548d8">SANTOSH FASHION HUB • ADMIN</span><h1>Online Orders</h1><p>Central Firestore order management.</p></div><div><a class="btn" href="./sfh-step7-admin-dashboard.html">Dashboard</a> <a class="btn gold" href="./index.html">Store ↗</a></div></header><section class="stats"><div class="stat"><span>Total</span><b id="all">0</b></div><div class="stat"><span>Pending</span><b id="pending">0</b></div><div class="stat"><span>Confirmed</span><b id="confirmed">0</b></div><div class="stat"><span>Shipped</span><b id="shipped">0</b></div><div class="stat"><span>Delivered</span><b id="delivered">0</b></div></section><section class="card"><div class="toolbar"><input id="q" placeholder="Search order ID, customer, mobile"><select id="statusFilter"><option>All</option><option>Pending</option><option>Confirmed</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select><button class="btn" id="refresh">↻ Refresh</button></div><div id="status" class="status" style="margin-top:11px">Checking Firebase…</div><div id="list"></div></section></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';import{getFirestore,collection,getDocs,query,orderBy,doc,updateDoc}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
const statusEl=document.getElementById('status'),listEl=document.getElementById('list');const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));let db=null,orders=[];
function ready(c){return c&&Object.values(c).every(v=>typeof v==='string'&&v.trim()&&!/^YOUR_/i.test(v))}
async function load(user){if(!user||user.email!=='santoshrawani123@gmail.com'){statusEl.className='status bad';statusEl.textContent='⚠️ Admin account required: sign in with the authorized shop admin email.';listEl.innerHTML='';return}try{const snap=await getDocs(query(collection(db,'orders'),orderBy('createdAt','desc')));orders=snap.docs.map(d=>({id:d.id,...d.data()}));render();statusEl.className='status ok';statusEl.textContent='✅ Loaded '+orders.length+' central online orders.'}catch(e){statusEl.className='status bad';statusEl.textContent='Could not read orders. Check Firestore rules/indexes. '+e.message}}
function render(){const q=document.getElementById('q').value.toLowerCase().trim(),sf=document.getElementById('statusFilter').value;const f=orders.filter(o=>(sf==='All'||o.status===sf)&&(!q||(`${o.id} ${o.customer?.name||''} ${o.customer?.mobile||''} ${o.customer?.city||''}`.toLowerCase().includes(q))));const counts={Total:orders.length,Pending:0,Confirmed:0,Shipped:0,Delivered:0};orders.forEach(o=>{if(counts[o.status]!=null)counts[o.status]++});document.getElementById('all').textContent=counts.Total;document.getElementById('pending').textContent=counts.Pending;document.getElementById('confirmed').textContent=counts.Confirmed;document.getElementById('shipped').textContent=counts.Shipped;document.getElementById('delivered').textContent=counts.Delivered;listEl.innerHTML=f.length?f.map(o=>{const items=Array.isArray(o.items)?o.items:[];return `<article class="order"><div class="head"><div><div class="id">Order ${esc(o.id)}</div><div class="date">${o.createdAt?.toDate?o.createdAt.toDate().toLocaleString('en-IN'):'Date pending'}</div></div><span class="pill">${esc(o.status||'Pending')}</span></div><div class="customer"><b>${esc(o.customer?.name)}</b> • ${esc(o.customer?.mobile)}<br>${esc(o.customer?.address)}, ${esc(o.customer?.city)} • PIN ${esc(o.customer?.pin)}<br>Payment: ${esc(o.customer?.payment)}</div><div class="items">${items.map(x=>`<div class="item"><span>${esc(x.name)} • ${esc(x.productId)} • Size ${esc(x.size)} × ${x.qty}</span><b>${money(x.lineTotal)}</b></div>`).join('')}</div><div class="foot"><div class="total">${money(o.total)}</div><div class="actions"><select onchange="window.changeOrderStatus('${o.id}',this.value)">${['Pending','Confirmed','Shipped','Delivered','Cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select>${o.customer?.mobile?`<a class="btn" target="_blank" href="https://wa.me/91${encodeURIComponent(o.customer.mobile)}?text=${encodeURIComponent('Hello '+(o.customer.name||'')+', update from Santosh Fashion Hub: Order '+o.id+' is '+(o.status||'Pending')+'.')}">💬 WhatsApp</a>`:''}</div></div></article>`}).join(''):'<div class="status" style="margin-top:12px">No orders match your filter.</div>'}
window.changeOrderStatus=async function(id,status){const o=orders.find(x=>x.id===id);if(!o)return;try{await updateDoc(doc(db,'orders',id),{status,updatedAt:new Date()});o.status=status;render();statusEl.className='status ok';statusEl.textContent='✅ Order '+id+' updated to '+status+'.'}catch(e){statusEl.className='status bad';statusEl.textContent='Update failed: '+e.message;}}
document.getElementById('q').addEventListener('input',render);document.getElementById('statusFilter').addEventListener('change',render);document.getElementById('refresh').addEventListener('click',()=>{onAuthStateChanged(currentUser=>{});if(window.__user)load(window.__user)});
try{await import('./firebase-config.js');const cfg=window.SFH_FIREBASE_CONFIG;if(!ready(cfg)){statusEl.className='status bad';statusEl.textContent='⚠️ Firebase config is not connected yet.'}else{const app=initializeApp(cfg);const auth=getAuth(app);db=getFirestore(app);onAuthStateChanged(auth,u=>{window.__user=u;load(u)})}}catch(e){statusEl.className='status bad';statusEl.textContent='Firebase initialization failed: '+e.message}
</script></body></html>
