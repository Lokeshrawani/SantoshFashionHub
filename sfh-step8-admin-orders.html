<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFH Admin | Orders</title><style>body{margin:0;font-family:Inter,system-ui,Arial;background:#f5f7fa;color:#101528}.wrap{max-width:1200px;margin:auto;padding:16px}.top{background:#0b1020;color:#fff;border-radius:18px;padding:20px}.top h1{margin:0;font-size:25px}.top p{margin:6px 0 0;color:#d2d8e3;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{background:#fff;border:1px solid #dfe4eb;border-radius:14px;padding:15px}.stat b{display:block;font-size:24px}.stat span{font-size:11px;color:#667085}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{padding:10px;border:1px solid #d9dee7;border-radius:10px;background:#fff}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.dark{background:#0b1020;color:#fff}.gold{background:#f4c95d}.white{background:#fff;border:1px solid #d9dee7}.order{background:#fff;border:1px solid #dfe4eb;border-radius:15px;padding:15px;margin-bottom:11px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.id{font-weight:950}.date,.meta{font-size:11px;color:#667085}.status{padding:6px 9px;border-radius:999px;font-size:10px;font-weight:900;background:#eef2ff}.items{margin:12px 0;background:#f7f8fa;border-radius:10px;padding:10px;font-size:12px;line-height:1.65}.customer{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.field{font-size:12px}.field b{display:block;font-size:10px;color:#667085;margin-bottom:2px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions select{padding:8px;border:1px solid #d9dee7;border-radius:8px}.total{font-weight:950;margin-top:8px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.customer{grid-template-columns:1fr}.wrap{padding:11px}}</style></head><body><main class="wrap"><section class="top"><h1>📦 Santosh Fashion Hub — Order Manager</h1><p>View local website orders and update status: Pending → Confirmed → Shipped → Delivered.</p></section><section class="stats"><div class="stat"><b id="all">0</b><span>Total Orders</span></div><div class="stat"><b id="pending">0</b><span>Pending</span></div><div class="stat"><b id="confirmed">0</b><span>Confirmed</span></div><div class="stat"><b id="delivered">0</b><span>Delivered</span></div></section><div class="toolbar"><input id="q" placeholder="Search order ID, customer, mobile"><select id="filter"><option>All</option><option>Pending</option><option>Confirmed</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select><button class="btn dark" onclick="location.href='index.html'">View Store</button><button class="btn gold" onclick="exportOrders()">Export Orders</button><button class="btn white" onclick="render()">Refresh</button></div><div id="list"></div></main><script>const KEY='sfh-orders';const STAT=['Pending','Confirmed','Shipped','Delivered','Cancelled'];function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}function save(x){localStorage.setItem(KEY,JSON.stringify(x))}function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}function setStatus(id,status){const a=load(),o=a.find(x=>x.id===id);if(!o)return;o.status=status;save(a);render()}function render(){const a=load(),q=document.getElementById('q').value.toLowerCase().trim(),f=document.getElementById('filter').value;document.getElementById('all').textContent=a.length;document.getElementById('pending').textContent=a.filter(x=>x.status==='Pending').length;document.getElementById('confirmed').textContent=a.filter(x=>x.status==='Confirmed').length;document.getElementById('delivered').textContent=a.filter(x=>x.status==='Delivered').length;const list=a.slice().reverse().filter(o=>(f==='All'||o.status===f)&&(!q||(`${o.id} ${o.customer?.name||''} ${o.customer?.mobile||''}`.toLowerCase().includes(q))));document.getElementById('list').innerHTML=list.length?list.map(o=>`<article class="order"><div class="head"><div><div class="id">${esc(o.id)}</div><div class="date">${new Date(o.createdAt).toLocaleString('en-IN')}</div></div><span class="status">${esc(o.status||'Pending')}</span></div><div class="customer"><div class="field"><b>CUSTOMER</b>${esc(o.customer?.name||'Guest')}</div><div class="field"><b>MOBILE</b>${esc(o.customer?.mobile||'')}</div><div class="field"><b>ADDRESS</b>${esc(o.customer?.address||'')} ${o.customer?.city?`, ${esc(o.customer.city)}`:''}</div><div class="field"><b>PAYMENT</b>${esc(o.customer?.payment||'')}</div></div><div class="items">${(o.items||[]).map(x=>`${esc(x.id)} — ${esc(x.name)} | Size ${esc(x.size)} | Qty ${x.qty} | ${money(x.lineTotal)}`).join('<br>')}</div><div class="total">Order Total: ${money(o.total)}</div><div class="actions"><select onchange="setStatus('${esc(o.id)}',this.value)">${STAT.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select><a class="btn dark" href="https://wa.me/?text=${encodeURIComponent('Order '+o.id+' | Customer '+(o.customer?.name||'')+' | Status: '+(o.status||'Pending'))}" target="_blank">WhatsApp</a></div></article>`).join(''):'<div class="order" style="text-align:center;color:#667085;padding:35px">No orders found.</div>'}function exportOrders(){const blob=new Blob([JSON.stringify(load(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sfh-orders.json';a.click();URL.revokeObjectURL(a.href)}['q','filter'].forEach(id=>document.getElementById(id).addEventListener('input',render));render()</script></body></html>
