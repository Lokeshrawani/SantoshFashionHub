<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Santosh Fashion Hub | My Orders</title><style>body{margin:0;font-family:Inter,system-ui,Arial;background:#f5f7fa;color:#101528}.wrap{max-width:1100px;margin:auto;padding:18px}.top{background:#0b1020;color:#fff;padding:18px;border-radius:16px}.top h1{margin:0;font-size:25px}.top p{margin:5px 0 0;color:#ccd3df;font-size:12px}.panel{background:#fff;border:1px solid #dde2ea;border-radius:16px;padding:16px;margin-top:15px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn,input,select{font:inherit}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.dark{background:#0b1020;color:#fff}.gold{background:#f4c95d}.ghost{background:#fff;border:1px solid #d9dee7}.order{border:1px solid #e0e4eb;border-radius:14px;padding:14px;margin-top:12px}.head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.id{font-weight:900}.status{padding:6px 9px;border-radius:99px;background:#eef3ff;font-size:10px;font-weight:900}.meta{color:#667085;font-size:11px;margin-top:6px}.items{margin:12px 0;padding:10px;background:#f7f8fa;border-radius:10px;font-size:12px}.total{font-weight:900}.empty{text-align:center;color:#667085;padding:35px}@media(max-width:600px){.wrap{padding:11px}.top h1{font-size:21px}}</style></head><body><main class="wrap"><section class="top"><h1>🧾 Santosh Fashion Hub — My Orders</h1><p>Track orders created from this browser and quickly contact the shop.</p></section><section class="panel"><div class="toolbar"><button class="btn dark" onclick="location.href='index.html'">← Continue Shopping</button><button class="btn gold" onclick="render()">Refresh</button><button class="btn ghost" onclick="clearHistory()">Clear Local History</button></div></section><section class="panel"><div id="orders"></div></section></main><script>const KEY='sfh-orders';function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}function render(){const a=load();document.getElementById('orders').innerHTML=a.length?a.slice().reverse().map(o=>`<article class="order"><div class="head"><div class="id">${o.id||'SFH-ORDER'}</div><span class="status">${o.status||'Pending'}</span></div><div class="meta">${new Date(o.createdAt||Date.now()).toLocaleString('en-IN')} • ${o.customer?.name||'Guest'} • ${o.customer?.phone||''}</div><div class="meta">${o.customer?.address||''} ${o.customer?.pin?`• PIN ${o.customer.pin}`:''}</div><div class="items">${(o.items||[]).map(x=>`${x.name} • ${x.id} • Size ${x.size} • Qty ${x.qty} • ${money(x.lineTotal||0)}`).join('<br>')}</div><div class="total">Total: ${money(o.total)}</div></article>`).join(''):'<div class="empty">No local orders yet.<br>Orders will appear here after using the new checkout.</div>'}function clearHistory(){if(confirm('Clear order history stored on this browser?')){localStorage.removeItem(KEY);render()}}render();</script></body></html>
