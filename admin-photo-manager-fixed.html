<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Santosh Fashion Hub — Photo Manager</title>
<style>
:root{--ink:#0b1020;--gold:#f4c95d;--paper:#f5f6fa;--line:#dfe3ea;--ok:#087443;--danger:#b42318;--blue:#2463eb}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--paper);color:var(--ink)}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:1250px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand h1{margin:0;font-size:25px}.brand p{margin:4px 0;color:#667085;font-size:12px}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 13px;font-weight:900}.btn.gold{background:var(--gold);border-color:var(--gold)}.hero{margin:16px 0;background:linear-gradient(135deg,#0b1020,#2a214f);color:#fff;border-radius:20px;padding:20px}.hero h2{margin:0 0 8px}.hero p{margin:0;color:#dbe1ea;line-height:1.6;font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);padding:12px;border-radius:16px;margin-bottom:16px}.search{flex:1;min-width:220px;padding:11px 13px;border:1px solid var(--line);border-radius:10px}.status{font-size:11px;font-weight:900;color:var(--ok);margin-left:auto;align-self:center}.status.error{color:var(--danger)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:12px}.muted{color:#667085;font-size:11px}.fields{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:12px}.fields input{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px}.gallery{display:grid;grid-template-columns:1fr 1.25fr;gap:12px}.main{height:300px;border:2px solid var(--line);border-radius:14px;background:#f8f9fb;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.main img{width:100%;height:100%;object-fit:contain}.placeholder{text-align:center;color:#667085;font-weight:800;font-size:12px;padding:20px}.badge{position:absolute;left:8px;top:8px;background:#0b1020;color:#fff;padding:6px 8px;border-radius:999px;font-size:9px;font-weight:900}.count{position:absolute;right:8px;top:8px;background:#fff;border:1px solid var(--line);padding:6px 8px;border-radius:999px;font-size:9px;font-weight:900}.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.slot{position:relative;min-width:0}.slot label.pick{width:100%;aspect-ratio:1;border:1px dashed #cfd5df;border-radius:10px;background:#f8f9fb;padding:0;display:grid;place-items:center;overflow:hidden;cursor:pointer}.slot label.pick img{width:100%;height:100%;object-fit:cover}.slot label.pick span{font-weight:900;color:#667085;font-size:18px}.slot .label{display:block;text-align:center;font-size:8px;font-weight:900;margin-top:4px;color:#667085}.slot .remove{position:absolute;right:2px;top:2px;width:22px;height:22px;border:0;border-radius:50%;background:#b42318;color:#fff;font-weight:900;z-index:3}.slot .mainbtn{width:100%;margin-top:4px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 2px;font-size:8px;font-weight:900}.slot input{position:absolute;left:-10000px;top:auto;width:1px;height:1px}.help{margin-top:9px;padding:9px 10px;border-radius:10px;background:#f0f4ff;color:#344054;font-size:11px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.photoStatus{font-size:11px;color:#667085;margin-top:7px}@media(max-width:820px){.gallery{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr 1fr}.fields input:first-child{grid-column:1/-1}}@media(max-width:520px){.wrap{padding:12px}.fields{grid-template-columns:1fr}.fields input:first-child{grid-column:auto}.slots{grid-template-columns:repeat(5,1fr)}.main{height:240px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="brand"><h1>Santosh Fashion Hub</h1><p>Reliable 5-photo product manager • Front • Left • Right • Back • Detail</p></div><div><a class="btn" href="./index.html">View Store</a> <a class="btn" href="./admin.html">Back to Admin</a></div></div>
<section class="hero"><h2>Photo Manager — fixed storage</h2><p>Photos are stored in the browser's IndexedDB, not localStorage. This removes the 2nd/3rd photo quota problem. Each product can have up to 5 photos.</p></section>
<div class="toolbar"><input id="search" class="search" placeholder="Search product name or ID"><button class="btn gold" onclick="addProduct()">＋ Add Product</button><button class="btn" onclick="saveMeta()">Save Product Details</button><span id="status" class="status"></span></div>
<div id="grid" class="grid"></div>
</div>
<script>
const META_KEY='sfh-products';
const DB_NAME='sfh-gallery-db';
const DB_VERSION=1;
const STORE='photos';
const LABELS=['Front','Left','Right','Back','Detail'];
const photoUrls=new Map();
let db=null, products=[], q='';
const BASE={id:'NEW1',cat:'T-Shirt',group:'Men',name:'New Product',price:499,old:699,tag:'NEW',desc:'',sizes:['M','L','XL'],stock:10,image:'',images:[]};

function msg(t,error=false){const e=document.getElementById('status');e.textContent=t;e.className='status'+(error?' error':'');clearTimeout(window.__m);window.__m=setTimeout(()=>{e.textContent='';e.className='status'},2600)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openDB(){if(db)return Promise.resolve(db);return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{db=r.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'key'})};r.onsuccess=()=>{db=r.result;resolve(db)};r.onerror=()=>reject(r.error||new Error('IndexedDB unavailable'))})}
function photoKey(id,n){return id+':'+n}
function putPhoto(id,n,blob){return openDB().then(d=>new Promise((res,rej)=>{const tx=d.transaction(STORE,'readwrite');tx.objectStore(STORE).put({key:photoKey(id,n),productId:id,slot:n,blob,updated:Date.now()});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)}))}
function getPhoto(id,n){return openDB().then(d=>new Promise((res,rej)=>{const r=d.transaction(STORE,'readonly').objectStore(STORE).get(photoKey(id,n));r.onsuccess=()=>res(r.result?.blob||null);r.onerror=()=>rej(r.error)}))}
function delPhoto(id,n){return openDB().then(d=>new Promise((res,rej)=>{const tx=d.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(photoKey(id,n));tx.oncomplete=res;tx.onerror=()=>rej(tx.error)}))}
function revokeUrl(id,n){const k=photoKey(id,n);const u=photoUrls.get(k);if(u){URL.revokeObjectURL(u);photoUrls.delete(k)}}
function setUrl(id,n,blob){revokeUrl(id,n);if(!blob)return '';const u=URL.createObjectURL(blob);photoUrls.set(photoKey(id,n),u);return u}
function readMeta(){let arr=[];try{arr=JSON.parse(localStorage.getItem(META_KEY)||'[]')}catch(e){arr=[]}if(!Array.isArray(arr))arr=[];return arr.map((p,i)=>({...BASE,...p,id:p.id||'P'+(i+1),images:[],image:''}))}
function leanMeta(arr){return arr.map(p=>{const x={...p};delete x.images;delete x.image;return x})}
function writeMeta(){const lean=leanMeta(products);try{localStorage.setItem(META_KEY,JSON.stringify(lean))}catch(e){try{localStorage.removeItem(META_KEY);localStorage.setItem(META_KEY,JSON.stringify(lean))}catch(e2){throw e2}}}
function dataUrlToBlob(u){try{const parts=u.split(',');const b=atob(parts[1]);const bytes=new Uint8Array(b.length);for(let i=0;i<b.length;i++)bytes[i]=b.charCodeAt(i);return new Blob([bytes],{type:(parts[0].match(/data:([^;]+)/)||[])[1]||'image/jpeg'})}catch(e){return null}}
async function migrateOldPhotos(){
  let raw=[];try{raw=JSON.parse(localStorage.getItem(META_KEY)||'[]')}catch(e){raw=[]}
  if(!Array.isArray(raw))raw=[];
  products=raw.map((p,i)=>({...BASE,...p,id:p.id||'P'+(i+1)}));
  let changed=false;
  for(const p of products){
    const legacy=Array.isArray(p.images)?p.images.filter(Boolean).slice(0,5):(p.image?[p.image]:[]);
    for(let n=0;n<legacy.length;n++){
      const src=legacy[n];
      if(typeof src==='string'&&src.startsWith('data:')){
        const blob=dataUrlToBlob(src);if(blob){try{await putPhoto(p.id,n,blob);changed=true}catch(e){console.warn(e)}}}
    }
    delete p.images;delete p.image;
  }
  if(changed||raw.some(p=>p.images||p.image)){try{writeMeta()}catch(e){msg('Could not save catalog details',true)}}
}
async function hydrate(){for(const p of products){for(let n=0;n<5;n++){const b=await getPhoto(p.id,n);if(b)setUrl(p.id,n,b)}}}
async function init(){
  try{await openDB();await migrateOldPhotos();await hydrate();render();msg('Photo storage ready')}catch(e){console.error(e);msg('Photo storage failed to open',true)}
}
function photoCount(id){let c=0;for(let n=0;n<5;n++)if(photoUrls.has(photoKey(id,n)))c++;return c}
function card(p,i){let thumbs='';for(let n=0;n<5;n++){const u=photoUrls.get(photoKey(p.id,n))||'';thumbs+=`<div class="slot"><label class="pick" for="f-${i}-${n}">${u?`<img src="${u}" alt="${LABELS[n]}">`:'<span>＋</span>'}</label><span class="label">${LABELS[n]}</span>${u?`<button class="remove" type="button" title="Remove" onclick="removePhoto(${i},${n})">×</button><button class="mainbtn" type="button" onclick="setMain(${i},${n})">${n===0?'★ Main':'Set Main'}</button>`:''}<input id="f-${i}-${n}" type="file" accept="image/*" onchange="pick(${i},${n},this.files[0]);this.value=''" /></div>`}
 const main=photoUrls.get(photoKey(p.id,0))||'';
 return `<article class="card"><div class="head"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.id)} • ${esc(p.cat||'')} • Stock ${Number(p.stock)||0}</div></div></div><div class="fields"><input value="${esc(p.name)}" placeholder="Product name" oninput="products[${i}].name=this.value"><input type="number" value="${Number(p.price)||0}" placeholder="Price" oninput="products[${i}].price=Number(this.value)||0"><input type="number" value="${Number(p.stock)||0}" placeholder="Stock" oninput="products[${i}].stock=Number(this.value)||0"></div><div class="gallery"><div class="main">${main?`<img src="${main}" alt="${esc(p.name)}"><span class="badge">MAIN PHOTO</span><span class="count">${photoCount(p.id)}/5</span>`:'<div class="placeholder">📸<br>Choose a photo from any slot</div>'}</div><div><div class="slots">${thumbs}</div><div class="help"><b>How to add:</b> click any slot → choose photo. You can fill Front, Left, Right, Back and Detail in any order. Photos are stored separately in IndexedDB, so 2nd and 3rd photos will not hit localStorage limits.</div><div class="actions"><button class="btn" type="button" onclick="saveOne(${i})">Save this product</button><button class="btn" type="button" onclick="removeAll(${i})">Remove all photos</button></div><div class="photoStatus">${photoCount(p.id)} photo(s) saved for this product</div></div></div></article>`;
}
function render(){const arr=products.map((p,i)=>({p,i})).filter(x=>{const s=(x.p.id+' '+x.p.name+' '+(x.p.cat||'')+' '+(x.p.group||'')).toLowerCase();return !q||s.includes(q)});document.getElementById('grid').innerHTML=arr.length?arr.map(x=>card(x.p,x.i)).join(''):'<div class="card">No products found. Click Add Product.</div>'}
async function pick(i,n,file){if(!file)return;if(!file.type.startsWith('image/')){msg('Please choose an image file',true);return}if(file.size>25*1024*1024){msg('Please choose an image below 25 MB',true);return}msg('Saving '+LABELS[n]+' photo…');try{const blob=await makeBlob(file);await putPhoto(products[i].id,n,blob);setUrl(products[i].id,n,blob);await saveOne(i,true);render();msg(LABELS[n]+' photo saved ✓')}catch(e){console.error(e);msg('Could not save this photo. Please try again.',true)}}
function makeBlob(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=()=>reject(r.error);r.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('Image decode failed'));img.onload=()=>{const max=1800,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);c.toBlob(b=>b?resolve(b):reject(new Error('JPEG conversion failed')),'image/jpeg',.84)};img.src=r.result};r.readAsDataURL(file)})}
async function removePhoto(i,n){try{await delPhoto(products[i].id,n);revokeUrl(products[i].id,n);render();msg(LABELS[n]+' removed')}catch(e){msg('Could not remove photo',true)}}
async function removeAll(i){if(!confirm('Remove all 5 photos for this product?'))return;for(let n=0;n<5;n++){await delPhoto(products[i].id,n);revokeUrl(products[i].id,n)}render();msg('All photos removed')}
async function setMain(i,n){if(n===0)return;const a=[];for(let k=0;k<5;k++)a[k]=await getPhoto(products[i].id,k);if(!a[n])return;const ordered=[a[n],...a.filter((x,k)=>x&&k!==n)];for(let k=0;k<5;k++){if(ordered[k])await putPhoto(products[i].id,k,ordered[k]);else await delPhoto(products[i].id,k)}for(let k=0;k<5;k++){if(ordered[k])setUrl(products[i].id,k,ordered[k]);else revokeUrl(products[i].id,k)}render();msg(LABELS[n]+' is now Main photo ✓')}
async function saveOne(i,silent=false){try{writeMeta();if(!silent)msg('Product details saved ✓')}catch(e){msg('Could not save product details',true)}}
async function saveMeta(){for(let i=0;i<products.length;i++)await saveOne(i,true);render();msg('All product details saved ✓')}
function addProduct(){const p={...BASE,id:'P'+Date.now().toString().slice(-8),name:'New Product'};products.unshift(p);saveOne(0,true).then(()=>render())}
document.getElementById('search').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();render()});
window.addEventListener('beforeunload',()=>photoUrls.forEach(u=>URL.revokeObjectURL(u)));
init();
</script>
</body>
</html>
