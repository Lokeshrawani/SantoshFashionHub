name: SFH Step 18 — Live Firebase Orders
on:
  push:
    paths:
      - 'sfh-step18-admin-live-orders.html'
      - 'sfh-step18-admin-live-orders.css'
      - 'sfh-step18-admin-live-orders.js'
      - 'sfh-step17-firestore-sync.js'
      - 'firebase-config.js'
      - 'admin.html'
      - '.github/workflows/sfh-step18-apply.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Step 17 script is loaded on storefront
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./firebase-config.js"></script>\n<script src="./sfh-step17-firestore-sync.js"></script>'
          if tag not in s and './sfh-step17-firestore-sync.js' not in s:
              s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          elif './sfh-step17-firestore-sync.js' in s and './firebase-config.js' not in s:
              s=s.replace('<script src="./sfh-step17-firestore-sync.js"></script>','<script src="./firebase-config.js"></script>\n<script src="./sfh-step17-firestore-sync.js"></script>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Add live orders button to admin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          tag='<a class="btn gold" href="./sfh-step18-admin-live-orders.html">🔥 Live Firebase Orders ↗</a>'
          if 'sfh-step18-admin-live-orders.html' not in s:
              marker='<a class="btn white" href="./index.html">← View Store</a>'
              s=s.replace(marker,tag+marker)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit generated integration changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html admin.html
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Apply Step 18 live Firebase order dashboard'
            git push
          fi
