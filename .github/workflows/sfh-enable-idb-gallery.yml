name: SFH Enable IndexedDB Gallery
on:
  push:
    branches: [main]
    paths:
      - '**'
permissions:
  contents: write
jobs:
  patch-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add gallery bridge to storefront
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="script.js"></script>'
          add = '<script src="sfh-idb-gallery.js"></script>'
          if add not in s:
              if marker not in s:
                  raise SystemExit('index.html marker not found')
              s = s.replace(marker, marker + add)
              p.write_text(s, encoding='utf-8')
              print('IndexedDB gallery bridge enabled in index.html')
          else:
              print('Bridge already enabled')
          PY
      - name: Commit storefront patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Enable IndexedDB product photos on storefront [idb-auto]'
          git push
