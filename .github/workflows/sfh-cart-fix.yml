name: SFH Cart Fix
on:
  push:
    paths:
      - 'sfh-cart-fix.js'
      - '.github/workflows/sfh-cart-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load cart fix after storefront scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./sfh-cart-fix.js"></script>'
          if 'sfh-cart-fix.js' not in s:
              s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit storefront cart fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No change needed.'; else git commit -m 'Fix direct Add to Cart flow'; git push; fi
