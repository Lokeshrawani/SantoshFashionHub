name: SFH Step 5 Apply
on:
  push:
    paths:
      - 'sfh-step5-product-details.js'
      - 'sfh-step5-product-details.css'
      - '.github/workflows/sfh-step5-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Step 5 assets into storefront
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="./sfh-step5-product-details.css">'
          js='<script src="./sfh-step5-product-details.js"></script>'
          if css not in s:
              s=s.replace('</head>', css+'\n</head>')
          if js not in s:
              s=s.replace('</body>', js+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Apply Step 5 product detail flow'
          git push
