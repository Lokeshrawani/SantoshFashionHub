name: SFH Step 4 Product Manager

on:
  push:
    paths:
      - 'admin-product-manager.html'
      - 'sfh-step4-product-routing.js'
      - '.github/workflows/sfh-step4-apply.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Step 4 manager link to admin
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          link='<a class="btn gold" href="./admin-product-manager.html">🛍️ Easy Product Manager ↗</a>'
          if link not in s:
              marker='<a class="btn gold" href="./admin-single-photo.html">📸 Simple Photo Upload</a>'
              if marker in s:
                  s=s.replace(marker,marker+link,1)
              else:
                  s=s.replace('</div>','<a class="btn gold" href="./admin-product-manager.html">🛍️ Easy Product Manager ↗</a></div>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Add Step 4 routing script to storefront
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          add='<script src="./sfh-step4-product-routing.js"></script>'
          if add not in s:
              s=s.replace('</body>',add+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit Step 4 patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html index.html admin-product-manager.html sfh-step4-product-routing.js
          git diff --cached --quiet && exit 0
          git commit -m 'Enable Step 4 easy product manager and exact subcategory routing'
          git push
