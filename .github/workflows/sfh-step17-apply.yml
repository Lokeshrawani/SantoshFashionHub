name: SFH Step 17 — Connect Firebase to storefront
on:
  push:
    paths:
      - 'firebase-config.js'
      - 'sfh-step17-firestore-sync.js'
      - '.github/workflows/sfh-step17-apply.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Firebase scripts are loaded on storefront
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tags = '<script src="./firebase-config.js"></script>\n<script src="./sfh-step17-firestore-sync.js"></script>'
          if './sfh-step17-firestore-sync.js' not in s:
              s = s.replace('</body>', tags + '\n</body>')
          elif './firebase-config.js' not in s:
              s = s.replace('<script src="./sfh-step17-firestore-sync.js"></script>', '<script src="./firebase-config.js"></script>\n<script src="./sfh-step17-firestore-sync.js"></script>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit storefront integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No storefront change needed.'
          else
            git commit -m 'Connect Firebase to storefront'
            git push
          fi
