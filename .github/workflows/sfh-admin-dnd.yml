name: SFH Admin Drag Drop Photos
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin photo reorder
        shell: python
        run: |
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          marker='SFH_ADMIN_DRAG_REORDER_V1'
          if marker in s:
              print('Already patched')
              raise SystemExit(0)
          needle='</script>\n</body>'
          patch=r'''\n/* SFH_ADMIN_DRAG_REORDER_V1 */\n(function initPhotoDragReorder(){\n  const KEY='sfh-products';\n  const LABELS=['Front','Left','Right','Back','Detail'];\n  const norm=()=>JSON.parse(localStorage.getItem(KEY)||'[]');\n  function save(arr){localStorage.setItem(KEY,JSON.stringify(arr));}\n  function reorder(i,a,b){\n    const arr=norm(); if(!arr[i]) return;\n    const imgs=Array.isArray(arr[i].images)?arr[i].images.filter(Boolean).slice(0,5):(arr[i].image?[arr[i].image]:[]);\n    while(imgs.length<Math.max(a,b)+1) imgs.push('');\n    [imgs[a],imgs[b]]=[imgs[b],imgs[a]];\n    while(imgs.length && !imgs[imgs.length-1]) imgs.pop();\n    arr[i].images=imgs.slice(0,5); arr[i].image=arr[i].images[0]||''; save(arr); location.reload();\n  }\n  function bind(){\n    document.querySelectorAll('.thumbSlot').forEach(slot=>{\n      const m=slot.querySelector('button[id^="slot-"]'); if(!m) return;\n      const id=m.id.split('-'); if(id.length<3) return; const i=Number(id[1]), n=Number(id[2]);\n      slot.draggable=true; slot.title='Drag this photo to another slot to reorder';\n      slot.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',JSON.stringify({i,n})); e.dataTransfer.effectAllowed='move'; slot.classList.add('sfh-dragging')});\n      slot.addEventListener('dragend',()=>slot.classList.remove('sfh-dragging'));\n      slot.addEventListener('dragover',e=>{e.preventDefault(); slot.classList.add('sfh-drag-over'); e.dataTransfer.dropEffect='move'});\n      slot.addEventListener('dragleave',()=>slot.classList.remove('sfh-drag-over'));\n      slot.addEventListener('drop',e=>{e.preventDefault(); slot.classList.remove('sfh-drag-over'); try{const x=JSON.parse(e.dataTransfer.getData('text/plain')); if(x.i===i && Number.isInteger(x.n) && n!==x.n) reorder(i,x.n,n)}catch(_){}});\n    });\n  }\n  const st=document.createElement('style'); st.textContent='.thumbSlot{transition:transform .15s,border-color .15s}.thumbSlot.sfh-dragging{opacity:.5;transform:scale(.97)}.thumbSlot.sfh-drag-over{border-radius:14px;outline:3px dashed var(--accent);outline-offset:2px;transform:translateY(-2px)}.galleryEditor:after{content:"Tip: drag a photo slot onto another slot to change its order";display:block;grid-column:1/-1;font-size:10px;color:#667085;font-weight:800;margin-top:-4px}'; document.head.appendChild(st);\n  const oldRender=window.render;\n  if(typeof oldRender==='function'){window.render=function(){oldRender(); setTimeout(bind,0)}}\n  setTimeout(bind,0);\n})();\n'''
          if needle not in s:
              raise SystemExit('anchor not found')
          s=s.replace(needle, patch+needle, 1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add drag and drop photo reordering to admin'
          git push