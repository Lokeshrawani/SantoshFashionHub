name: SFH Admin Drag Drop Photos
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin photo reorder and touch controls
        shell: python
        run: |
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          marker='SFH_ADMIN_TOUCH_MAIN_V2'
          if marker in s:
              print('Already patched')
              raise SystemExit(0)
          needle='</script>\n</body>'
          patch=r'''\n/* SFH_ADMIN_TOUCH_MAIN_V2 */\n(function initPhotoTouchAndMain(){\n  const KEY='sfh-products';\n  const LABELS=['Front','Left','Right','Back','Detail'];\n  const getAll=()=>JSON.parse(localStorage.getItem(KEY)||'[]');\n  const saveAll=arr=>localStorage.setItem(KEY,JSON.stringify(arr));\n  const normalized=(p)=>{const a=Array.isArray(p.images)?p.images.filter(Boolean).slice(0,5):(p.image?[p.image]:[]);return {imgs:a,image:a[0]||p.image||''}};\n  function swap(i,a,b){\n    const arr=getAll(); if(!arr[i])return; const n=normalized(arr[i]); const imgs=n.imgs;\n    while(imgs.length<Math.max(a,b)+1) imgs.push('');\n    [imgs[a],imgs[b]]=[imgs[b],imgs[a]]; while(imgs.length&&!imgs[imgs.length-1])imgs.pop();\n    arr[i].images=imgs.slice(0,5); arr[i].image=arr[i].images[0]||''; saveAll(arr); location.reload();\n  }\n  function setMain(i,n){\n    const arr=getAll(); if(!arr[i])return; const x=normalized(arr[i]); if(!x.imgs[n])return;\n    const imgs=x.imgs.slice(); const selected=imgs[n]; imgs.splice(n,1); imgs.unshift(selected);\n    arr[i].images=imgs.slice(0,5); arr[i].image=arr[i].images[0]||''; saveAll(arr); location.reload();\n  }\n  function bind(){\n    document.querySelectorAll('.thumbSlot').forEach(slot=>{\n      const btn=slot.querySelector('button[id^="slot-"]'); if(!btn)return;\n      const parts=btn.id.split('-'); if(parts.length<3)return; const i=Number(parts[1]), n=Number(parts[2]);\n      slot.draggable=true; slot.title='Drag to reorder • tap Set Main below to make this the main photo';\n      if(!slot.querySelector('.sfh-main-btn') && btn.querySelector('img')){\n        const b=document.createElement('button'); b.type='button'; b.className='sfh-main-btn'; b.textContent=n===0?'★ Main':'Set Main'; b.title='Make this photo the main product photo';\n        b.onclick=(e)=>{e.stopPropagation();setMain(i,n)}; slot.appendChild(b);\n      }\n      let dragStart=null;\n      slot.addEventListener('dragstart',e=>{dragStart={i,n};e.dataTransfer.setData('text/plain',JSON.stringify({i,n}));e.dataTransfer.effectAllowed='move';slot.classList.add('sfh-dragging')});\n      slot.addEventListener('dragend',()=>{dragStart=null;slot.classList.remove('sfh-dragging')});\n      slot.addEventListener('dragover',e=>{e.preventDefault();slot.classList.add('sfh-drag-over');e.dataTransfer.dropEffect='move'});\n      slot.addEventListener('dragleave',()=>slot.classList.remove('sfh-drag-over'));\n      slot.addEventListener('drop',e=>{e.preventDefault();slot.classList.remove('sfh-drag-over');try{const x=JSON.parse(e.dataTransfer.getData('text/plain'));if(x.i===i&&Number.isInteger(x.n)&&n!==x.n)swap(i,x.n,n)}catch(_){}});\n      let touchTimer=null,touchPoint=null;\n      slot.addEventListener('pointerdown',e=>{if(e.pointerType==='touch' && !e.target.closest('.sfh-main-btn')){touchPoint={x:e.clientX,y:e.clientY};touchTimer=setTimeout(()=>{slot.classList.add('sfh-touching');slot.dataset.sfhTouch='1'},220)}});\n      slot.addEventListener('pointermove',e=>{if(e.pointerType==='touch'&&touchPoint&&slot.dataset.sfhTouch==='1'){const dx=e.clientX-touchPoint.x,dy=e.clientY-touchPoint.y;if(Math.hypot(dx,dy)>18){document.querySelectorAll('.thumbSlot.sfh-touch-target').forEach(x=>x.classList.remove('sfh-touch-target'));slot.classList.add('sfh-touch-target')}}});\n      slot.addEventListener('pointerup',()=>{clearTimeout(touchTimer);touchTimer=null;touchPoint=null;slot.classList.remove('sfh-touching');delete slot.dataset.sfhTouch});\n      slot.addEventListener('pointercancel',()=>{clearTimeout(touchTimer);touchTimer=null;touchPoint=null;slot.classList.remove('sfh-touching');delete slot.dataset.sfhTouch});\n    });\n  }\n  const st=document.createElement('style'); st.textContent=`\n    .thumbSlot{touch-action:none;transition:transform .15s,border-color .15s,box-shadow .15s}\n    .thumbSlot.sfh-dragging{opacity:.5;transform:scale(.97)}\n    .thumbSlot.sfh-drag-over{outline:3px dashed var(--accent);outline-offset:2px;transform:translateY(-2px)}\n    .thumbSlot.sfh-touching{box-shadow:0 0 0 3px rgba(101,72,216,.18);transform:scale(.98)}\n    .thumbSlot .sfh-main-btn{position:absolute;left:4px;top:4px;z-index:5;border:0!important;border-radius:7px!important;background:rgba(11,16,32,.86)!important;color:#fff!important;padding:4px 6px!important;font-size:7px!important;font-weight:900!important;width:auto!important;height:auto!important;min-height:0!important;aspect-ratio:auto!important;display:block!important}\n    .thumbSlot .sfh-main-btn:hover{background:var(--accent)!important}\n  `; document.head.appendChild(st);\n  const oldRender=window.render; if(typeof oldRender==='function'){window.render=function(){oldRender();setTimeout(bind,0)}}\n  setTimeout(bind,0);\n})();\n'''
          if needle not in s:
              raise SystemExit('anchor not found')
          s=s.replace(needle, patch+needle, 1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add touch photo controls and set main photo'
          git push
