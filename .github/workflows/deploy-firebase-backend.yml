name: Deploy Firebase commerce backend

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - "firestore.rules"
      - "firestore.indexes.json"
      - ".github/workflows/deploy-firebase-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment credentials
        id: credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT is not configured. Skipping Firebase deployment."
          fi

      - name: Checkout
        if: steps.credentials.outputs.available == 'true'
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        if: steps.credentials.outputs.available == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Node.js
        if: steps.credentials.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase dependencies
        if: steps.credentials.outputs.available == 'true'
        run: |
          npm install --prefix functions
          npm install --global firebase-tools

      - name: Check Functions syntax
        if: steps.credentials.outputs.available == 'true'
        run: npm --prefix functions run check

      - name: Deploy Firebase services
        if: steps.credentials.outputs.available == 'true'
        run: firebase deploy --project santosh-fashion-hub --only functions,firestore:rules,firestore:indexes --non-interactive
