name: SFH Step 6 Apply Checkout
on:
  push:
    paths:
      - 'sfh-step6-checkout.js'
      - 'sfh-step6-checkout.css'
      - '.github/workflows/sfh-step6-apply.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Step 6 assets into index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="./sfh-step6-checkout.css">'
          js='<script src="./sfh-step6-checkout.js"></script>'
          if css not in s:
              s=s.replace('</head>', css+'\n</head>')
          if js not in s:
              s=s.replace('</body>', js+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit storefront wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Wire Step 6 checkout into storefront'
          git push
