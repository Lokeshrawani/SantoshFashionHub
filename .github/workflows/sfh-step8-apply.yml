name: SFH Step 8 Apply
on:
  push:
    paths:
      - 'sfh-step8-orders.js'
      - 'sfh-step8-orders.html'
      - 'sfh-step8-admin-orders.html'
      - 'sfh-step6-checkout.js'
      - '.github/workflows/sfh-step8-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire order script and admin links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<script src="./sfh-step6-checkout.js"></script>'
          if 'sfh-step8-orders.js' not in s:
              s=s.replace('</body>', '  <script src="./sfh-step8-orders.js"></script>\n  '+marker+'\n</body>') if marker not in s else s.replace('</body>', '  <script src="./sfh-step8-orders.js"></script>\n</body>')
          if 'My Orders' not in s:
              s=s.replace('<nav class="nav"><div>', '<nav class="nav"><div><a href="./sfh-step8-orders.html">My Orders</a>')
          p.write_text(s)
          for fn in ['admin.html','sfh-step7-admin-dashboard.html','admin-product-manager.html']:
              p=Path(fn)
              if not p.exists(): continue
              s=p.read_text()
              if 'sfh-step8-admin-orders.html' not in s:
                  insert='<a class="btn gold" href="./sfh-step8-admin-orders.html">📦 Order Manager ↗</a>'
                  if '</body>' in s: s=s.replace('</body>', insert+'\n</body>')
                  else: s += '\n'+insert
                  p.write_text(s)
          PY
      - name: Commit generated wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html admin.html sfh-step7-admin-dashboard.html admin-product-manager.html
          git diff --cached --quiet || git commit -m 'Wire Step 8 order history and admin links'
          git push
