<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Santosh Fashion Hub — Simple Photo Upload</title>
<style>
:root{--ink:#0b1020;--gold:#f4c95d;--paper:#f5f6fa;--line:#dfe3ea;--ok:#087443;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.btn{display:inline-block;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 13px;font-weight:900}.gold{background:var(--gold);border-color:var(--gold)}.hero{margin:14px 0;background:linear-gradient(135deg,#0b1020,#2a214f);color:#fff;border-radius:18px;padding:18px}.hero h2{margin:0 0 6px}.hero p{margin:0;color:#dce1eb;font-size:13px;line-height:1.55}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}.search{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:16px;padding:14px}.muted{font-size:11px;color:#667085}.preview{margin-top:12px;width:100%;aspect-ratio:1;border:2px dashed #cfd5df;border-radius:14px;background:#f8f9fb;display:grid;place-items:center;overflow:hidden;cursor:pointer}.preview img{width:100%;height:100%;object-fit:contain}.preview span{font-size:42px;color:#98a2b3}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.status{font-size:11px;font-weight:900;margin-top:8px}.ok{color:var(--ok)}.bad{color:var(--bad)}input[type=file]{display:none}.help{margin-top:8px;background:#f0f4ff;padding:9px;border-radius:9px;font-size:11px;line-height:1.5;color:#344054}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><h1 style="margin:0;font-size:24px">Santosh Fashion Hub</h1><div class="muted">Simple Mobile Photo Manager</div></div><div><a class="btn" href="./admin.html">← Admin</a> <a class="btn" href="./index.html">View Store ↗</a></div></div>
<section class="hero"><h2>📸 One Product = One Main Photo</h2><p>आप mobile से photo चुनें या Drag & Drop करें। Photo compressed होकर browser catalog में save होगी और इसी device/browser पर storefront में दिखाई देगी। बाद में shared cloud system जोड़ सकते हैं।</p></section>
<div class="panel"><input id="search" class="search" placeholder="Search product name or ID"></div>
<div id="grid" class="grid"></div>
</div>
<script>
const KEY='sfh-products';const IMAGE_KEY='sfh-single-images';let products=[];let q='';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function load(){try{products=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){products=[]}if(!Array.isArray(products))products=[];products=products.map((p,i)=>({...p,id:p.id||'P'+(i+1),image:typeof p.image==='string'?p.image:''}));let im={};try{im=JSON.parse(localStorage.getItem(IMAGE_KEY)||'{}')}catch(e){im={}};products=products.map(p=>im[p.id]?{...p,image:im[p.id]}:p);render()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(products));const map={};products.forEach(p=>{if(typeof p.image==='string'&&p.image.startsWith('data:image/'))map[p.id]=p.image});localStorage.setItem(IMAGE_KEY,JSON.stringify(map));return true}catch(e){alert('Storage full. Use a smaller photo or remove old demo photos.');return false}}
function render(){const arr=products.map((p,i)=>({p,i})).filter(x=>!q||(`${x.p.id} ${x.p.name} ${x.p.cat} ${x.p.group}`).toLowerCase().includes(q));document.getElementById('grid').innerHTML=arr.length?arr.map(x=>card(x.p,x.i)).join(''):'<div class="panel">No products found.</div>'}
function card(p,i){return `<article class="card"><h3 style="margin:0 0 3px">${esc(p.name||'Untitled Product')}</h3><div class="muted">${esc(p.id)} • ${esc(p.cat||'')} • Stock ${Number(p.stock)||0}</div><label class="preview" id="drop-${i}" for="file-${i}">${p.image?`<img src="${p.image}" alt="${esc(p.name)}">`:'<span>＋</span>'}</label><input id="file-${i}" type="file" accept="image/*" onchange="pick(${i},this.files[0]);this.value=''"/><div class="actions"><button class="btn gold" onclick="document.getElementById('file-${i}').click()">📱 Choose Photo</button>${p.image?'<button class="btn" onclick="removePhoto('+i+')">Remove Photo</button>':''}</div><div id="st-${i}" class="status"></div><div class="help">Mobile में photo choose करें। PC पर photo को ऊपर वाले box पर Drag & Drop भी कर सकते हैं।</div></article>`}
function compress(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=900,s=Math.min(1,max/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*s)),h=Math.max(1,Math.round(im.height*s));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);c.toBlob(b=>{if(!b)return reject(new Error('compress failed'));const rr=new FileReader();rr.onload=()=>resolve(rr.result);rr.onerror=reject;rr.readAsDataURL(b)},'image/jpeg',.68)};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
async function pick(i,file){if(!file)return;if(!file.type.startsWith('image/'))return alert('Please select an image');const st=document.getElementById('st-'+i);st.className='status';st.textContent='Compressing & saving…';try{products[i].image=await compress(file);if(!save())return;render();document.getElementById('st-'+i).textContent='Photo saved ✓'}catch(e){console.error(e);st.className='status bad';st.textContent='Could not save photo'}}
function removePhoto(i){products[i].image='';if(save())render()}
document.getElementById('search').addEventListener('input',e=>{q=e.target.value.toLowerCase().trim();render()});load();
products.forEach((p,i)=>{setTimeout(()=>{const d=document.getElementById('drop-'+i);if(!d)return;['dragenter','dragover'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.style.borderColor='#2463eb'}));['dragleave','drop'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.style.borderColor='#cfd5df'}));d.addEventListener('drop',e=>{const f=e.dataTransfer?.files?.[0];if(f)pick(i,f)})},0)})
</script></body></html>
