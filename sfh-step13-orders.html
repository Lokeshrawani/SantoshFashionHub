<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Santosh Fashion Hub — Step 13 Orders</title>
<style>:root{--ink:#0b1020;--gold:#f4c95d;--paper:#f5f6fa;--line:#dfe3ea;--muted:#667085;--ok:#087443;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,Arial}.wrap{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.top h1{margin:4px 0;font-size:28px}.top p{margin:0;color:var(--muted);font-size:13px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 13px;border-radius:10px;text-decoration:none;font-weight:900}.gold{background:var(--gold);border-color:var(--gold)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:18px}.status{padding:12px 14px;border-radius:12px;background:#eef1f6;font-size:12px;font-weight:800}.ok{background:#eaf8ef;color:var(--ok)}.bad{background:#fdecec;color:var(--bad)}.order{border-top:1px solid var(--line);padding:16px 0}.order:first-child{border-top:0}.head{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.id{font-weight:950}.date{font-size:11px;color:var(--muted)}.pill{padding:6px 9px;border-radius:99px;font-size:10px;font-weight:900;background:#eef1f6}.items{margin:10px 0}.item{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:12px}.customer{font-size:12px;color:#445066;line-height:1.6}.total{font-size:18px;font-weight:950;text-align:right}@media(max-width:600px){.wrap{padding:12px}.top h1{font-size:22px}.card{padding:14px}.item{align-items:flex-start}}</style></head>
<body><main class="wrap"><header class="top"><div><span style="font-size:10px;font-weight:950;letter-spacing:2px;color:#6548d8">SANTOSH FASHION HUB</span><h1>My Online Orders</h1><p>Central Firestore orders for your signed-in customer account.</p></div><a class="btn gold" href="./index.html">← Store</a></header>
<section class="card"><div id="status" class="status">Checking Firebase…</div><div id="orders" style="margin-top:12px"></div></section></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import {getAuth,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import {getFirestore,collection,query,where,getDocs,orderBy} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
const status=document.getElementById('status'), box=document.getElementById('orders');
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));
function ready(c){return c&&Object.values(c).every(v=>typeof v==='string'&&v.trim()&&!/^YOUR_/i.test(v))}
try{await import('./firebase-config.js');const cfg=window.SFH_FIREBASE_CONFIG;if(!ready(cfg)){status.className='status bad';status.textContent='⚠️ Firebase config is not connected yet.'}
else{const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);onAuthStateChanged(auth,async user=>{if(!user){status.className='status bad';status.textContent='Please sign in first on Step 12.';box.innerHTML='<p><a class="btn gold" href="./sfh-step12-firebase-auth.html">Open Customer Login</a></p>';return}status.className='status ok';status.textContent='✅ Signed in as '+(user.email||user.uid);try{const q=query(collection(db,'orders'),where('uid','==',user.uid),orderBy('createdAt','desc'));const snap=await getDocs(q);if(!snap.size){box.innerHTML='<p>No central online orders found yet.</p>';return}box.innerHTML=snap.docs.map(d=>{const o=d.data(),items=Array.isArray(o.items)?o.items:[];return `<article class="order"><div class="head"><div><div class="id">Order ${esc(d.id)}</div><div class="date">${o.createdAt?.toDate?o.createdAt.toDate().toLocaleString('en-IN'):'Date pending'}</div></div><span class="pill">${esc(o.status||'Pending')}</span></div><div class="customer">${esc(o.customer?.name)} • ${esc(o.customer?.mobile)}<br>${esc(o.customer?.city)} • PIN ${esc(o.customer?.pin)}</div><div class="items">${items.map(x=>`<div class="item"><span>${esc(x.name)} • ${esc(x.size)} × ${x.qty}</span><b>${money(x.lineTotal)}</b></div>`).join('')}</div><div class="total">${money(o.total)}</div></article>`}).join('')}catch(e){status.className='status bad';status.textContent='Could not load orders. Check Firestore rules and indexes.';box.innerHTML='<p>'+esc(e.message)+'</p>'}})}
}catch(e){status.className='status bad';status.textContent='Firebase initialization failed.';box.innerHTML='<p>'+esc(e.message)+'</p>'}
</script></body></html>
