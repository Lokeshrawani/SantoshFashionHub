<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Santosh Fashion Hub — Live Orders</title>
<link rel="stylesheet" href="./sfh-step18-admin-live-orders.css">
</head>
<body>
<div class="wrap">
<header class="top">
  <div><div class="brand">SFH</div><h1>Live Order Dashboard</h1><p>Firebase-backed customer orders for Santosh Fashion Hub.</p></div>
  <div class="actions"><a href="./admin.html">← Admin</a><a href="./index.html">Store</a></div>
</header>
<section class="panel" id="authPanel">
  <h2>Admin sign in</h2>
  <p>Use the Firebase account configured for the shop admin.</p>
  <div class="form"><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="signIn">Sign in</button><button id="signOut" class="ghost" hidden>Sign out</button></div>
  <div id="authStatus" class="status">Checking Firebase configuration…</div>
</section>
<section id="dashboard" hidden>
  <div class="stats"><div><b id="total">0</b><span>Total</span></div><div><b id="pending">0</b><span>Pending</span></div><div><b id="confirmed">0</b><span>Confirmed</span></div><div><b id="shipped">0</b><span>Shipped</span></div><div><b id="delivered">0</b><span>Delivered</span></div><div><b id="cancelled">0</b><span>Cancelled</span></div></div>
  <div class="panel"><div class="toolbar"><input id="search" placeholder="Search order ID, customer, mobile…"><select id="filter"><option>All</option><option>Pending</option><option>Confirmed</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select></div></div>
  <div id="orders" class="orders"></div>
</section>
</div>
<script src="./firebase-config.js"></script>
<script type="module" src="./sfh-step18-admin-live-orders.js"></script>
</body>
</html>
