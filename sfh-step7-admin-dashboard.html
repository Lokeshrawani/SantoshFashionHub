<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFH Admin Dashboard</title><style>body{margin:0;font-family:Inter,system-ui,Arial;background:#f6f7fb;color:#101528}header{background:#0b1020;color:#fff;padding:18px 20px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:24px}header p{margin:5px 0 0;color:#cfd5e1;font-size:12px}.wrap{max-width:1250px;margin:auto;padding:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid #dde1e8;border-radius:16px;padding:18px}.stat span,.muted{color:#667085;font-size:12px}.stat strong{display:block;font-size:28px;margin-top:6px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.toolbar input,.toolbar select{padding:11px 12px;border:1px solid #d8dde7;border-radius:10px;background:#fff}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.dark{background:#0b1020;color:#fff}.gold{background:#f4c95d;color:#16120a}.grid{display:grid;grid-template-columns:1fr;gap:12px}.row{background:#fff;border:1px solid #dde1e8;border-radius:16px;padding:15px;display:grid;grid-template-columns:70px 1fr auto;gap:14px;align-items:center}.thumb{width:70px;height:80px;border-radius:12px;background:#f0eff8;display:grid;place-items:center;font-size:30px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.name{font-weight:900}.meta{font-size:12px;color:#667085;margin-top:4px}.price{font-weight:900;margin-top:7px}.stock{font-size:12px;font-weight:900}.low{color:#b54708}.ok{color:#087443}.out{color:#b42318}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions input{width:70px;padding:8px;border:1px solid #d8dde7;border-radius:8px}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:58px 1fr}.thumb{width:58px;height:68px}.actions{grid-column:1/-1}.wrap{padding:14px}}@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}.stat strong{font-size:22px}}</style></head><body><header><h1>🛍️ Santosh Fashion Hub — Admin Dashboard</h1><p>Products • Stock • Pricing • Quick actions</p></header><main class="wrap"><section class="stats"><div class="stat"><span>Total Products</span><strong id="totalProducts">0</strong></div><div class="stat"><span>Total Stock Units</span><strong id="totalStock">0</strong></div><div class="stat"><span>Low Stock</span><strong id="lowStock">0</strong></div><div class="stat"><span>Out of Stock</span><strong id="outStock">0</strong></div></section><div class="toolbar"><input id="q" placeholder="Search product, ID, category..."><select id="dept"><option value="All">All Departments</option><option>Men</option><option>Ladies</option><option>Kids</option></select><select id="stockFilter"><option value="all">All Stock</option><option value="low">Low Stock ≤ 3</option><option value="out">Out of Stock</option><option value="ok">In Stock</option></select><button class="btn dark" onclick="location.href='admin-product-manager.html'">＋ Product Manager</button><button class="btn gold" onclick="exportProducts()">⬇ Export JSON</button></div><div id="list" class="grid"></div></main><script>const KEY='sfh-products';let products=JSON.parse(localStorage.getItem(KEY)||'[]');function save(){localStorage.setItem(KEY,JSON.stringify(products));render()}function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}function stats(){document.getElementById('totalProducts').textContent=products.length;document.getElementById('totalStock').textContent=products.reduce((a,p)=>a+Number(p.stock||0),0);document.getElementById('lowStock').textContent=products.filter(p=>Number(p.stock)>0&&Number(p.stock)<=3).length;document.getElementById('outStock').textContent=products.filter(p=>Number(p.stock)<=0).length}function render(){stats();const q=document.getElementById('q').value.toLowerCase().trim(),d=document.getElementById('dept').value,s=document.getElementById('stockFilter').value;const list=products.filter(p=>(d==='All'||p.group===d||p.department===d)&&((p.name+' '+p.id+' '+p.cat+' '+(p.subcategory||'')).toLowerCase().includes(q))&&(s==='all'||(s==='low'&&Number(p.stock)>0&&Number(p.stock)<=3)||(s==='out'&&Number(p.stock)<=0)||(s==='ok'&&Number(p.stock)>0)));document.getElementById('list').innerHTML=list.length?list.map(p=>{const st=Number(p.stock||0);const cls=st<=0?'out':st<=3?'low':'ok';return `<article class="row"><div class="thumb">${p.image?`<img src="${p.image}" alt="">`:(p.art||'👕')}</div><div><div class="name">${p.name||'Unnamed product'}</div><div class="meta">${p.id} • ${p.group||p.department||''} • ${p.subcategory||p.cat||''}</div><div class="price">${money(p.price)} <span class="muted">MRP ${money(p.old)}</span></div><div class="stock ${cls}">${st<=0?'🔴 Out of Stock':st<=3?'🟠 Low Stock: '+st:'🟢 Stock: '+st}</div></div><div class="actions"><input type="number" min="0" value="${st}" onchange="setStock('${p.id}',this.value)"><button class="btn dark" onclick="edit('${p.id}')">Edit</button></div></article>`}).join(''):'<div class="stat"><strong>No products found</strong><span>Try another filter.</span></div>'}function setStock(id,val){const p=products.find(x=>x.id===id);if(!p)return;p.stock=Math.max(0,Number(val)||0);save()}function edit(id){location.href='admin-product-manager.html?id='+encodeURIComponent(id)}function exportProducts(){const blob=new Blob([JSON.stringify(products,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sfh-products.json';a.click();URL.revokeObjectURL(a.href)}['q','dept','stockFilter'].forEach(id=>document.getElementById(id).addEventListener('input',render));render()</script><a class="btn gold" href="./sfh-step8-admin-orders.html">📦 Order Manager ↗</a>
</body></html>
