<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Santosh Fashion Hub — Order Manager</title><style>:root{--ink:#0b1020;--gold:#f4c95d;--paper:#f5f6fa;--line:#dfe3ea;--muted:#667085;--ok:#087443;--warn:#b54708;--bad:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--paper);color:var(--ink)}header{background:linear-gradient(135deg,#0b1020,#242e50);color:#fff;padding:22px}header .top{max-width:1200px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{margin:0;font-size:26px}header p{margin:5px 0 0;color:#d6dce6;font-size:12px}.wrap{max-width:1200px;margin:auto;padding:18px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:16px}.stat{padding:15px}.stat span{display:block;color:var(--muted);font-size:10px;font-weight:800}.stat strong{display:block;font-size:25px;margin-top:5px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;min-width:190px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 13px;font-weight:900;cursor:pointer}.gold{background:var(--gold);border-color:var(--gold)}.dark{background:var(--ink);color:#fff}.grid{display:grid;gap:13px}.card{padding:16px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.orderid{font-size:11px;color:#6548d8;font-weight:950;letter-spacing:.7px}.customer{font-size:17px;font-weight:950;margin-top:3px}.meta{font-size:11px;color:var(--muted);line-height:1.6;margin-top:5px}.status{padding:7px 10px;border-radius:999px;font-size:9px;font-weight:950;white-space:nowrap}.pending{background:#fff4d6;color:#8a5a00}.confirmed{background:#e8f2ff;color:#175cd3}.shipped{background:#e9e8ff;color:#4b3cc4}.delivered{background:#e7f6ed;color:var(--ok)}.cancelled{background:#fdecec;color:var(--bad)}.items{margin:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.item{display:flex;justify-content:space-between;gap:8px;padding:9px 0;font-size:11px}.bottom{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.total{font-size:18px;font-weight:950}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions select{padding:9px;border:1px solid var(--line);border-radius:9px;font-weight:800}.empty{text-align:center;padding:45px;color:var(--muted);background:#fff;border:1px dashed #cfd5df;border-radius:15px}.notice{font-size:11px;color:var(--muted);background:#fff8dc;border:1px solid #f0dd98;padding:11px;border-radius:10px;margin-bottom:13px}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.wrap{padding:12px}.stats{grid-template-columns:1fr 1fr}.head{display:block}.status{display:inline-block;margin-top:9px}.bottom{align-items:flex-start;flex-direction:column}.toolbar input,.toolbar select{min-width:0;width:100%}}</style></head><body><header><div class="top"><div><h1>📦 Santosh Fashion Hub — Order Manager</h1><p>Step 16 • Admin status update & customer tracking sync</p></div><div><a class="btn gold" href="./index.html">View Store ↗</a></div></div></header><main class="wrap"><section class="stats"><div class="stat"><span>Total</span><strong id="sTotal">0</strong></div><div class="stat"><span>Pending</span><strong id="sPending">0</strong></div><div class="stat"><span>Confirmed</span><strong id="sConfirmed">0</strong></div><div class="stat"><span>Shipped</span><strong id="sShipped">0</strong></div><div class="stat"><span>Delivered</span><strong id="sDelivered">0</strong></div></section><div class="notice">Status changes are saved in this browser and are immediately reflected on the customer’s Order Tracking page when it uses the same browser data.</div><div class="toolbar"><input id="q" placeholder="Search Order ID, customer, mobile..."><select id="filter"><option value="All">All Status</option><option>Pending</option><option>Confirmed</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select><button class="btn dark" onclick="exportOrders()">⬇ Export Orders</button><button class="btn" onclick="location.href='./sfh-step7-admin-dashboard.html'">Product / Stock</button></div><div id="list" class="grid"></div></main><script>const KEY='sfh-orders';let orders=[];try{orders=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){orders=[]}if(!Array.isArray(orders))orders=[];const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));function save(){localStorage.setItem(KEY,JSON.stringify(orders));render()}function stats(){const n=s=>orders.filter(o=>(o.status||'Pending')===s).length;document.getElementById('sTotal').textContent=orders.length;document.getElementById('sPending').textContent=n('Pending');document.getElementById('sConfirmed').textContent=n('Confirmed');document.getElementById('sShipped').textContent=n('Shipped');document.getElementById('sDelivered').textContent=n('Delivered')}function setStatus(id,status){const o=orders.find(x=>x.id===id);if(!o)return;o.status=status;o.updatedAt=new Date().toISOString();save()}function render(){stats();const q=document.getElementById('q').value.toLowerCase().trim(),f=document.getElementById('filter').value;const arr=orders.filter(o=>(f==='All'||(o.status||'Pending')===f)&&(!q||(`${o.id} ${o.name||o.customer?.name||''} ${o.mobile||o.customer?.mobile||''}`.toLowerCase().includes(q)))).sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));document.getElementById('list').innerHTML=arr.length?arr.map(o=>{const st=o.status||'Pending',cls=st.toLowerCase();const items=Array.isArray(o.items)?o.items:[];return `<article class="card"><div class="head"><div><div class="orderid">${esc(o.id||'SFH-ORDER')}</div><div class="customer">${esc(o.name||o.customer?.name||'Customer')}</div><div class="meta">📱 ${esc(o.mobile||o.customer?.mobile||'')} • 📍 ${esc(o.city||o.customer?.city||'')} • ${esc(o.createdAt?new Date(o.createdAt).toLocaleString('en-IN'):'')}</div></div><span class="status ${cls}">${esc(st)}</span></div><div class="items">${items.map(i=>`<div class="item"><span>${esc(i.name||i.productName||i.id||'Item')} • Size ${esc(i.size||'-')} × ${Number(i.qty||1)}</span><b>${money(i.total||Number(i.price||0)*Number(i.qty||1))}</b></div>`).join('')}</div><div class="meta">Address: ${esc(o.address||o.customer?.address||'Not provided')} ${o.payment?'<br>Payment: '+esc(o.payment):''}</div><div class="bottom"><div class="total">${money(o.total)}</div><div class="actions"><select onchange="setStatus('${esc(o.id)}',this.value)">${['Pending','Confirmed','Shipped','Delivered','Cancelled'].map(x=>`<option ${x===st?'selected':''}>${x}</option>`).join('')}</select><a class="btn" target="_blank" href="https://wa.me/919835567894?text=${encodeURIComponent('Hello Santosh Fashion Hub, update for order '+(o.id||'')+': '+st)}">💬 WhatsApp</a></div></div></article>`}).join(''):'<div class="empty">No matching orders found.</div>'}function exportOrders(){const blob=new Blob([JSON.stringify(orders,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sfh-orders.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}['q','filter'].forEach(id=>document.getElementById(id).addEventListener('input',render));render();</script></body></html>
